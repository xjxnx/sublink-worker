#:schema node_modules/wrangler/config-schema.json
name = "sublink-worker"
main = "src/worker.jsx"
compatibility_date = "2024-07-24"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "SUBLINK_KV", id = "8943789ed0af49659f887fc740d11240" }
]

[assets]
directory = "./public"
# Force the Worker to handle SEO routes so a stray static file can't shadow them.
run_worker_first = ["/sitemap.xml", "/robots.txt"]
