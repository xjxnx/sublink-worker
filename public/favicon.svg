<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0a1426"/>
    </linearGradient>
    <linearGradient id="shield" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feFlood flood-color="#cdedff" flood-opacity="0.95"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feGaussianBlur stdDeviation="2.6"/>
      <feComposite in2="SourceAlpha" operator="in" result="ig"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="ig"/>
      </feMerge>
    </filter>
    <filter id="sGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <path d="M32 6 C46 6 56 14 56 26 C56 38 46 50 32 58 C18 50 8 38 8 26 C8 14 18 6 32 6 Z"
        fill="url(#shield)" stroke="#bae6fd" stroke-width="2" stroke-linejoin="round" filter="url(#innerGlow)"/>
  <path d="M32 12 C43 12 51 18.5 51 27.5 C51 37 43 46.5 32 53 C21 46.5 13 37 13 27.5 C13 18.5 21 12 32 12 Z"
        fill="none" stroke="#e0f2fe" stroke-width="1.3" stroke-linejoin="round" opacity="0.45"/>
  <path d="M40 24 C38 20 30 19 26 22 C22 25 24 29 30 31 C36 33 42 35 40 41 C38 46 29 46 24 43"
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#sGlow)"/>
</svg>
